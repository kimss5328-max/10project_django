{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<section class="card auth">
  <h1>로그인</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.errors %}<div class="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>{% endif %}
    <div class="field"><label for="id_username">아이디</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">비밀번호</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">로그인</button>
  </form>
  <p class="sub">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
